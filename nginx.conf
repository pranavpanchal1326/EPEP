events {
  worker_connections 1024;
}

http {

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Gzip compression — reduces transfer size 60-80%
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  server {

    listen 8080;  # Cloud Run REQUIRES port 8080
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                   always;
    add_header X-Frame-Options         "DENY"                      always;
    add_header X-XSS-Protection        "1; mode=block"             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # SPA routing — send all paths to index.html
    # This is CRITICAL for React Router to work on Cloud Run
    # Without this: /map /quiz /evm all return 404
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Immutable cache for hashed assets (JS, CSS, fonts)
    # Vite adds content hashes to filenames — safe to cache forever
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Fonts — self-hosted woff2
    location /fonts/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Access-Control-Allow-Origin "*";
      try_files $uri =404;
    }

    # Icons and PWA assets
    location /icons/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # GeoJSON — cache 30 days (data changes rarely)
    location ~* \.geojson$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri =404;
    }

    # Manifest and service worker — NO cache (must always be fresh)
    location ~* (manifest\.webmanifest|sw\.js)$ {
      expires -1;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri =404;
    }

    # 404 handling — send to React app
    error_page 404 /index.html;
  }
}

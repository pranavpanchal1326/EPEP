steps:

  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/epep-repo/epep:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/epep-repo/epep:latest'
      - '.'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-south1'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/epep-repo/epep'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-south1'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - deploy
      - epep
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/epep-repo/epep:$COMMIT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --timeout=30
    env:
      - 'CLOUDSDK_COMPUTE_REGION=asia-south1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/epep-repo/epep:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/epep-repo/epep:latest'
